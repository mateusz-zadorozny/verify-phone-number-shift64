name: E2E

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  playwright:
    name: Playwright (wp-env + WooCommerce)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (plugin runtime)
        run: composer install --prefer-dist --no-dev --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start WordPress + WooCommerce (wp-env) and seed the store
        run: npx wp-env start

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show WordPress debug log on failure
        if: failure()
        run: npx wp-env run cli cat /var/www/html/wp-content/debug.log || true
